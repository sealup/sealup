# The docs site at sealup.dev (decision 0036; spec #41 decision 40), public: builds `site/` and
# deploys it to GitHub Pages. release.yml calls it once the release is published, so the site
# matches the released version; it can also be run by hand (on a tag) to redeploy. The build and
# its checks are CI's `site` job, step for step: every CLI link has a page, no broken link, no
# sideways scroll at 375 px, the theme switch (the runner's Chrome, through playwright-core).
#
# Hardening (0017, R26): actions pinned to full commit SHAs, the token reads contents only,
# checkout keeps no credentials, no install script runs, no cache. The deploy job's writes are in
# the workflow gate's write table; the environment github-pages must allow the v* tags.

name: Pages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install
        run: npm ci --ignore-scripts

      - name: Dependency security audit
        run: npm audit --audit-level=low

      - name: Site checks, proven to bite
        run: npm test

      # Writes the config page from schema.json, then builds into site/dist/.
      - name: Build
        run: npm run build

      - name: Every CLI link has a page, no broken link, no sideways scroll at 375 px, the theme switch
        run: npm run check

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
