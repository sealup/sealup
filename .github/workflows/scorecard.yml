# OpenSSF Scorecard (I-045; exploration 03 §7; spec #41 decision 39): a weekly check of the
# repo's supply-chain practice (pinned actions, token permissions, branch protection, reviews...).
#
# Hardening (0017, R26): actions pinned to full commit SHAs, the token reads contents only,
# checkout keeps no credentials. The one write is the analysis job's `id-token`, listed in the
# workflow gate's write table: it publishes the results to the OpenSSF API, which serves the
# badge and lets anyone check them. No upload to code scanning (it would need
# `security-events`); the SARIF file stays a workflow artifact. Scorecard's rules for publishing:
# no top-level env or defaults, and only its approved actions in the job.
#
# The job runs only after export, like CodeQL: in the private repo the GITHUB_TOKEN cannot run
# Scorecard's GraphQL commit query ("Resource not accessible by integration"), and a private
# repo cannot publish, so the badge comes from the public repo alone.

name: Scorecard

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    if: github.repository == 'sealup/sealup'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30
